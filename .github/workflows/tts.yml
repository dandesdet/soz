name: Uzbek audio
on:
  push:
    branches: [main]
    paths: [words.js, tools/tts.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - run: python tools/tts.py
      - name: Commit
        run: |
          git config user.name "soz-bot"; git config user.email "soz-bot@users.noreply.github.com"
          git add audio audio.js
          git diff --cached --quiet && exit 0
          git commit -m "Uzbek audio for new words"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
