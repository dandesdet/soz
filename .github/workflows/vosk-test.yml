name: vosk test
on: { push: { branches: [vosk-test] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts && sudo apt-get install -y -q ffmpeg >/dev/null
      - run: python tools/stt_test.py
