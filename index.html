<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soʻz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF3F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap">
<style>
/* Layout: one-screen app — counters on top, a single card stack in the middle, hint at the bottom. Accent = Samarkand majolica blue. */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --fg:#0F232A; --muted:#3E555D; --line:#D5E1E4;
  --accent:#17698A; --good:#1E9A55; --bad:#D23F3F; --chip:#E1ECEF;
  --font:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C181D; --surface:#152730; --fg:#EAF2F4; --muted:#B3C6CC; --line:#233A43;
  --accent:#5DB9DA; --good:#3DCB80; --bad:#FF6A6A; --chip:#1E343D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C181D; --surface:#152730; --fg:#EAF2F4; --muted:#B3C6CC; --line:#233A43;
  --accent:#5DB9DA; --good:#3DCB80; --bad:#FF6A6A; --chip:#1E343D; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:16px;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:480px;margin:0 auto;box-sizing:border-box}

/* top: the "known" folder */
.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.backbtn{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px 0 6px;border-radius:12px;border:0;background:transparent;color:var(--fg);font:600 18px var(--font);cursor:pointer}
.backbtn svg{width:24px;height:24px}
.backbtn:hover{background:var(--chip)}
.backbtn:active{transform:scale(.96)}
/* language picker */
.picker{height:100%;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:480px;margin:0 auto;box-sizing:border-box;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.picker h1{margin:0;font-size:32px;font-weight:600;text-align:center}
.langs{display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;justify-content:space-between;gap:16px;height:88px;padding:0 24px;border-radius:24px;border:0;
  background:var(--surface);color:var(--fg);box-shadow:0 8px 28px rgba(15,35,42,.08);cursor:pointer;font:inherit}
.lang:hover{box-shadow:0 8px 28px rgba(15,35,42,.16)}
.lang:active{transform:scale(.98)}
.ln{font-size:24px;font-weight:600}
.lk{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.lk svg{width:24px;height:24px;color:var(--good)}
.lk .of{font-size:16px;font-weight:400;color:var(--muted)}
.folder{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:12px;border:0;
  background:transparent;color:var(--fg);font:600 20px var(--font);font-variant-numeric:tabular-nums;cursor:pointer}
.folder svg{width:26px;height:26px;color:var(--good)}
.folder:hover{background:var(--chip)}
.folder:active{transform:scale(.96)}
.folder.bump svg{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.25)}}

.banner{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-radius:12px;background:var(--chip);font-size:16px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font:600 16px var(--font);cursor:pointer}
.link:hover{color:var(--fg)}

/* stage + cards: outer .card moves with the finger, inner .flip turns over */
.stage{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0;margin:auto;width:100%;height:min(100%,520px);touch-action:none;cursor:grab;
  perspective:1400px;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .26s}
.card.next{transform:translateY(14px) scale(.94);opacity:.7;pointer-events:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box;
  background:var(--surface);border-radius:24px;box-shadow:0 8px 28px rgba(15,35,42,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.face.rear{transform:rotateY(180deg)}
.pic{font-family:var(--emoji);font-size:136px;line-height:1;display:grid;place-items:center}
.pic img.gen{width:240px;height:240px;border-radius:24px}
.rear .pic img.gen{width:120px;height:120px;border-radius:16px}
.row .e img.gen{border-radius:8px}
.pic img{width:176px;height:176px;max-width:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.pic.num{font-family:var(--font);font-weight:600;font-size:112px;color:var(--accent)}
.en{font-size:24px;color:var(--muted);text-wrap:balance}
.rear .pic{font-size:64px}
.rear .pic img{width:96px;height:96px}
.rear .pic.num{font-size:56px}
.uz{font-size:40px;font-weight:600;line-height:1.15;text-wrap:balance}
.ru{font-size:24px;color:var(--muted);text-wrap:balance;margin-top:-8px}
.say{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;border:0;
  background:var(--chip);color:var(--fg);font:600 16px var(--font);cursor:pointer}
.say:hover{background:var(--line)}
.say:active{transform:scale(.96)}
.stamp{position:absolute;top:24px;padding:4px 14px;border-radius:12px;border:2px solid;font:600 20px var(--font);opacity:0;pointer-events:none}
.stamp.yes{left:24px;color:var(--good);transform:rotate(-8deg)}
.stamp.no{right:24px;color:var(--bad);transform:rotate(8deg)}

.tint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .26s}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;padding:0 8px}
.hint .l{color:var(--bad)} .hint .r{color:var(--good)}

.done{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:24px}
.done .big{font-size:20px;font-weight:600}
.done p{margin:0;color:var(--muted)}

/* archive sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:80%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;gap:12px}
.sheet h2{margin:0;font-size:20px;font-weight:600}
.sheet .sub{color:var(--muted)}
.list{overflow:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.35) transparent}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .e{font-family:var(--emoji);font-size:28px;width:40px;text-align:center;display:grid;place-items:center}
.row .e img{width:40px;height:40px}
.row .e.num{font-family:var(--font);font-weight:600;font-size:18px;color:var(--accent)}
.row .w{display:flex;flex-direction:column;min-width:0}
.row .w b{font-weight:600;font-size:18px}
.row .w span{color:var(--muted)}
.btn{height:48px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:600 16px var(--font);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
:root[data-theme="dark"] .btn{color:#0C181D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0C181D}}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct{align-self:center;border:0;background:transparent;font:400 16px var(--font);color:var(--muted);padding:8px 12px;border-radius:12px;cursor:pointer;text-align:center}
.acct b{font-weight:600;color:var(--accent)}
.acct:hover{background:var(--chip)}
.acct:active{transform:scale(.97)}
.link.center{align-self:center}
.danger{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.link.bad{color:var(--bad)}
.tgbox{display:flex;justify-content:center;min-height:40px}
.tgbox[data-g]{min-height:44px}
.sub.center{text-align:center}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.card,.flip,.tint{transition:none!important}}
</style>
</head>
<body>

<div class="picker" id="picker" hidden>
  <h1>Учим слова</h1>
  <div class="langs">
    <button class="lang" type="button" data-lang="uz"><span class="ln">Oʻzbekcha</span><span class="lk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg><b id="k-uz">0</b><span class="of">из <span id="n-uz">0</span></span></span></button>

    <button class="lang" type="button" data-lang="en"><span class="ln">English</span><span class="lk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg><b id="k-en">0</b><span class="of">из <span id="n-en">0</span></span></span></button>
  </div>
  <button class="acct" id="openSync" type="button"></button>
</div>
<div class="scrim" id="pscrim" hidden>
  <div class="sheet psheet" id="syncSheet" hidden>

    <button class="link center" id="saveLater" type="button" hidden>Позже</button>
    <div class="err sub" id="syncStatus" hidden></div>
    <div class="danger" id="danger">
      <button class="link center" id="logout" type="button">Выйти на этом устройстве</button>
      <button class="link center bad" id="wipe" type="button">Стереть весь прогресс</button>
    </div>
  </div>
</div>
<div class="app" id="app" hidden>
  <div class="top"><button class="backbtn" id="back" type="button" aria-label="Языки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span id="langName">Oʻzbekcha</span></button><button class="folder" id="openArchive" type="button" aria-label="Знаю"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg><span id="cKnown">0</span></button></div>
  <div class="banner" id="banner" hidden><span id="bannerText"></span><button class="link" id="exitArchive" type="button">Выйти</button></div>
  <div class="stage" id="stage"></div>
  <div class="hint" id="hint" hidden><span class="l">← Не знаю</span><span>Тап — перевернуть</span><span class="r">Знаю →</span></div>
</div>
<div class="tint" id="tint"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet">
  <h2>Знаю</h2>
  <div class="sub" id="archSub"></div>
  <div class="list" id="archList"></div>
  <button class="btn" id="reviewArchive" type="button">Повторить</button>
</div></div>

const MIN = 6e4, DAY = 864e5;
const WAIT = { 2: DAY, 3: 3 * DAY, 4: 7 * DAY, 5: 30 * DAY };   // stage → interval
let KEY = LANGS.uz.key;
function loadState(key) { try { const v = JSON.parse(localStorage.getItem(key)); if (v && v.st) return v; } catch (e) {} return { st: {}, updated: 0 }; }
let S = { st: {}, updated: 0 };

let queue = [], mode = 'learn', archTotal = 0;
const $ = id => document.getElementById(id);

/* ---------- spaced repetition ---------- */
const QMIN = 10;   // cards kept in the queue
function refill() {
  const now = Date.now(), inQ = new Set(queue);
  const due = WORDS.filter(w => { const r = S.st[w.id]; return r && !r.arch && r.due <= now && !inQ.has(w.id); })
                   .sort((a, b) => S.st[a.id].due - S.st[b.id].due);
  queue.push(...due.map(w => w.id));
  if (queue.length < QMIN) {                                       // always mix in new words, so a missed word
    const fresh = WORDS.filter(w => !S.st[w.id] && !inQ.has(w.id)).slice(0, QMIN - queue.length);  // comes back after other cards, not in a loop
    queue.push(...fresh.map(w => w.id));
  }
}
function requeue(id, pos) { queue.splice(Math.min(pos, queue.length), 0, id); }

function answer(know) {
  const id = queue.shift(), now = Date.now();
  const r = S.st[id] || { s: 0, lap: 0, str: 0 };
  if (mode === 'archive') {
    if (!know) { r.arch = 0; r.s = 0; r.lap++; r.str = 0; r.due = now; }
  } else if (know) {
    r.str++;
    if (r.lap === 0) {                                                     // never missed: knew it from the start
      r.arch = 1;                                                          // known from the start → straight to the folder
    } else {                                                               // was missed once: spaced repetition
      r.s++;
      if (r.s >= 6) r.arch = 1;                                            // survived the 30-day check → folder
      else if (r.s === 1) { r.due = now; requeue(id, 7); }                 // once more this session
      else r.due = now + WAIT[r.s];                                        // 1 → 3 → 7 → 30 days
    }
  } else {
    r.lap++; r.str = 0; r.s = 0; r.due = now; requeue(id, Math.min(3 * r.lap, 15)); // back in 3, 6, 9… cards — others get through
  }
  r.t = now; S.st[id] = r;
  save(); maybeAskToSave();
  if (mode === 'archive' && !queue.length) exitArchive();
  render(true);
}

function newCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(16); crypto.getRandomValues(b); return Array.from(b, x => a[x % a.length]).join(''); }

async function rpc(fn, args) {
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });

let syncState = 'idle', lastSync = Number(ls.get('soz-last-sync')) || 0, pushTimer = 0;
function save() {

const stats = st => { let k = 0, l = 0; for (const id in st) st[id].arch ? k++ : l++; return [k, l]; };
async function pushLang(lang) {
  if (!navigator.onLine) return;
  const loc = loadState(LANGS[lang].key), st = loc.st, [known, learning] = stats(st), n = Number(ls.get('soz-pending-' + lang)) || 0;
  try {
    await rpc('soz_push', { p_code: CODE, p_lang: lang, p_data: loc.reset ? { ...st, _reset: loc.reset } : st, p_known: known, p_learning: learning, p_answers: n });
    ls.set('soz-pending-' + lang, String(Math.max(0, (Number(ls.get('soz-pending-' + lang)) || 0) - n)));
    markSynced();
  } catch (e) { syncState = 'offline'; paintSync(); }
}
function markSynced() { syncState = 'ok'; lastSync = Date.now(); ls.set('soz-last-sync', String(lastSync)); paintSync(); }
// Pull everything, merge word by word (newer answer wins), push back what this device has newer.
let syncing = false;
async function syncAll() {
  if (syncing || !navigator.onLine) { if (!navigator.onLine) { syncState = 'offline'; paintSync(); } return; }
  syncing = true;
  try {
    await rpc('soz_hello', { p_code: CODE, p_name: ls.get('soz-name') || null, p_platform: /iPhone|iPad/.test(navigator.userAgent) ? 'iOS' : /Android/.test(navigator.userAgent) ? 'Android' : 'Desktop' });
    const rows = await rpc('soz_pull', { p_code: CODE }) || [];
    const remote = Object.fromEntries(rows.map(r => [r.lang, r.data || {}]));
    for (const lang in LANGS) {
      const key = LANGS[lang].key, loc = loadState(key), rs = remote[lang] || {};
      let pulled = false, localNewer = false;
      const rr = rs._reset || 0; delete rs._reset;
      if (rr > (loc.reset || 0)) { for (const id in loc.st) if ((loc.st[id].t || 0) <= rr) delete loc.st[id]; loc.reset = rr; pulled = true; }
      for (const id in rs) if (!loc.st[id] || (rs[id].t || 0) > (loc.st[id].t || 0)) { loc.st[id] = rs[id]; pulled = true; }
      for (const id in loc.st) if (!rs[id] || (loc.st[id].t || 0) > (rs[id].t || 0)) localNewer = true;
      if (pulled) {
        ls.set(key, JSON.stringify(loc));

}

/* ---------- gestures ---------- */
const tint = $('tint');
function setTint(dx) {
  const a = Math.min(Math.abs(dx) / 220, 1);
  tint.style.transition = 'none';
  tint.style.background = dx > 0 ? 'var(--good)' : 'var(--bad)';
  tint.style.opacity = (a * 0.22).toFixed(3);
}
function clearTint() { tint.style.transition = ''; tint.style.opacity = 0; }

function bind(card) {
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  let x0 = 0, y0 = 0, t0 = 0, dx = 0, dy = 0, down = false, moved = false;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-say]')) return;
    down = true; moved = false; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); dx = dy = 0;
    card.setPointerCapture(e.pointerId); card.style.transition = 'none'; card.style.cursor = 'grabbing';
  });
  card.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    card.style.transform = `translate(${dx}px, ${dy * 0.25}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(dx / 100, 1));
    no.style.opacity = Math.max(0, Math.min(-dx / 100, 1));
    setTint(dx);
  });
  const up = () => {
    if (!down) return; down = false; card.style.cursor = '';
    if (!moved) { card.style.transition = ''; card.classList.toggle('open'); return; }
    const v = Math.abs(dx) / (performance.now() - t0);
    if (Math.abs(dx) > 90 || (v > 0.6 && Math.abs(dx) > 30)) fling(card, dx > 0);
    else { card.style.transition = ''; card.style.transform = ''; yes.style.opacity = no.style.opacity = 0; clearTint(); }
  };
  card.addEventListener('pointerup', up);
  card.addEventListener('pointercancel', up);
  const say = card.querySelector('[data-say]');
  if (say) say.addEventListener('click', e => { e.stopPropagation(); speak(BY[queue[0]].t); });
}
let flying = false;
function fling(card, know) {
  if (flying) return; flying = true;
  setTint(know ? 220 : -220);
  card.querySelector(know ? '.stamp.yes' : '.stamp.no').style.opacity = 1;
  card.style.transition = 'transform .24s ease-in, opacity .24s ease-in';
  card.style.transform = `translate(${know ? 140 : -140}vw, 0) rotate(${know ? 24 : -24}deg)`;
  card.style.opacity = 0;
  const back = document.querySelector('.card.next');
  if (back) { back.style.transform = 'none'; back.style.opacity = 1; }
  setTimeout(() => { clearTint(); flying = false; answer(know); }, 240);
}

  if (e.key === 'ArrowRight') fling(c, true);
  else if (e.key === 'ArrowLeft') fling(c, false);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); c.classList.toggle('open'); }
  else if (e.key === 'Escape') { if (mode === 'archive') { exitArchive(); render(); } else showPicker(); }
});

/* ---------- archive ---------- */
function archived() { return WORDS.filter(w => S.st[w.id] && S.st[w.id].arch); }
function openArchive() {
  const a = archived();
  $('archSub').textContent = a.length ? `${a.length} слов. Они больше не показываются, пока ты сам не захочешь повторить.` : 'Пока пусто. Слово попадает сюда, когда ты уверенно его знаешь.';
  $('archList').innerHTML = a.map(w => `<div class="row"><div class="e${isNum(w.img) ? ' num' : ''}">${picFor(w)}</div><div class="w"><b>${w.t}</b><span>${w.ru}</span></div></div>`).join('');
  $('reviewArchive').hidden = !a.length;
  $('reviewArchive').textContent = `Повторить ${a.length} слов`;
  $('scrim').hidden = false;
}
function closeArchive() { $('scrim').hidden = true; }
function startArchive() {
  const ids = archived().map(w => w.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  mode = 'archive'; queue = ids; closeArchive(); render();
}
function exitArchive() { mode = 'learn'; queue = []; }
$('openArchive').onclick = openArchive;
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeArchive(); });
$('reviewArchive').onclick = startArchive;
$('exitArchive').onclick = () => { exitArchive(); render(); };

/* ---------- language picker ---------- */
function knownCount(lang) {
  const st = loadState(LANGS[lang].key).st, ws = buildWords(lang);
  return ws.filter(w => st[w.id] && st[w.id].arch).length;
}
function refreshPicker() { paintAcctLine(); for (const l in LANGS) { $('k-' + l).textContent = knownCount(l); $('n-' + l).textContent = buildWords(l).length; } }
function showPicker() {
  closeArchive(); closeSheet(); mode = 'learn'; queue = [];
  refreshPicker();
  $('app').hidden = true; $('picker').hidden = false;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
function openLang(lang) {
  LANG = lang; KEY = LANGS[lang].key; S = loadState(KEY);
  WORDS = buildWords(lang); BY = Object.fromEntries(WORDS.map(w => [w.id, w]));
  queue = []; mode = 'learn'; lastKnown = -1; findVoice();
  $('langName').textContent = LANGS[lang].name;
  $('picker').hidden = true; $('app').hidden = false;
  if (location.hash !== '#' + lang) history.pushState(null, '', '#' + lang);
  render();
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => openLang(b.dataset.lang));
$('back').onclick = () => history.state === null && location.hash ? history.back() : showPicker();
window.addEventListener('popstate', () => { if (!location.hash) showPicker(); else if (LANGS[location.hash.slice(1)]) openLang(location.hash.slice(1)); });
/* ---------- name + sync sheets ---------- */
function openSheet(id) { document.querySelectorAll('.psheet').forEach(s => s.hidden = s.id !== id); $('pscrim').hidden = false; }
function closeSheet() { $('pscrim').hidden = true; }
$('pscrim').addEventListener('click', e => { if (e.target === $('pscrim')) closeSheet(); });
function totalKnown() { let n = 0; for (const l in LANGS) n += knownCount(l); return n; }
function paintAcctLine() {
  const a = account(), b = $('openSync');
  if (a) b.innerHTML = 'Ты вошёл · <b></b>', b.querySelector('b').textContent = a.name || (a.p === 'google' ? 'Google' : 'Telegram');
  else b.innerHTML = 'Слова не сохранены · <b>Войти</b>';
}
// prompt = shown by itself after some swipes (has «Позже», no sign-out/wipe)
function openSync(prompt) {
  const a = account(), n = totalKnown();
  $('accTitle').textContent = a ? 'Аккаунт' : 'Сохрани слова';
  $('accText').textContent = a
    ? 'Ты вошёл через ' + (a.p === 'google' ? 'Google' : 'Telegram') + (a.username ? ' · @' + a.username : a.name ? ' · ' + a.name : '') + '. На другом устройстве войди так же — слова будут общими.'
    : (n ? 'У тебя уже ' + n + ' слов в папке. ' : '') + 'Войди — слова не пропадут при смене телефона и будут общими на всех устройствах. Входи везде одним способом.';
  $('accLogin').hidden = !!a;
  $('saveLater').hidden = !(prompt === true);
  $('danger').hidden = prompt === true;
  document.querySelectorAll('[data-tgerr]').forEach(el => el.hidden = true);
  paintSync(); openSheet('syncSheet'); paintDanger(); mountTelegram(); mountGoogle();
  syncAll();
}
$('openSync').onclick = () => openSync(false);
$('saveLater').onclick = closeSheet;
// After ~20 answers (then every 50 more) ask a signed-out learner to save the words.
function maybeAskToSave() {
  if (account()) return;
  const n = (Number(ls.get('soz-answers')) || 0) + 1; ls.set('soz-answers', String(n));
  const next = Number(ls.get('soz-save-next')) || 20;
  if (n >= next) { ls.set('soz-save-next', String(n + 50)); setTimeout(() => openSync(true), 350); }
}
/* ---------- sign out / wipe: two taps, the second one confirms ---------- */
function armed(btn, first, second, act) {
  btn.textContent = first; btn.dataset.armed = '';
  btn.onclick = () => {
    if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = second; setTimeout(() => { if (btn.dataset.armed) { btn.dataset.armed = ''; btn.textContent = first; } }, 4000); return; }
    act();
  };
}
function clearDevice() {
  const keep = new Set(['soz-name-asked', 'soz-codes']);
  try { Object.keys(localStorage).filter(k => k.startsWith('soz-') && !keep.has(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  CODE = newCode(); ls.set('soz-code', CODE); rememberCode(CODE); lastSync = 0;
}
function paintDanger() {
  const a = account();
  $('logout').hidden = !a;
  armed($('logout'), 'Выйти на этом устройстве',
    'Нажми ещё раз — слова останутся в аккаунте ' + (a && a.p === 'google' ? 'Google' : 'Telegram'),
    () => { try { window.google && google.accounts.id.disableAutoSelect(); } catch (e) {} clearDevice(); closeSheet(); showPicker(); });
  armed($('wipe'), 'Стереть весь прогресс', 'Нажми ещё раз — все языки начнутся с нуля на всех устройствах',
    async () => {
      const now = Date.now();
      for (const l in LANGS) { ls.set(LANGS[l].key, JSON.stringify({ st: {}, updated: now, reset: now })); ls.set('soz-pending-' + l, '0'); }
      closeSheet(); showPicker();
      for (const l in LANGS) await pushLang(l);   // other devices see the reset mark and clear too
    });
}
function adoptCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!CODE_RE.test(c)) return false;
  if (c !== CODE) { CODE = c; ls.set('soz-code', c); rememberCode(c); }
  syncAll(); return true;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pscrim').hidden) closeSheet(); });
/* ---------- login with Telegram: the account keeps the progress code forever ---------- */
const TG_BOT = 'soz_words_bot';
const account = () => { try { return JSON.parse(ls.get('soz-account') || 'null'); } catch (e) { return null; } };
function paintAccount() { paintAcctLine(); }
function mountTelegram() {
  if (account()) return;
  document.querySelectorAll('[data-tg]').forEach(box => {
    if (box.closest('[hidden]') || box.childElementCount) return;
    const s = document.createElement('script');
    s.async = true; s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.dataset.telegramLogin = TG_BOT; s.dataset.size = 'large'; s.dataset.radius = '12'; s.dataset.userpic = 'false';
    s.dataset.onauth = 'onTgAuth(user)';
    box.appendChild(s);
  });
}
window.onTgAuth = async user => {
  try {
    const r = await fetch(SB + '/functions/v1/soz-tg-login', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ tg: user, code: CODE }) });
    if (!r.ok) throw new Error('login ' + r.status);
    const d = await r.json();
    finishLogin('tg', d);
  } catch (e) {
    document.querySelectorAll('[data-tgerr]').forEach(el => el.hidden = false);
  }
};
function finishLogin(p, d) {
    ls.set('soz-account', JSON.stringify({ p, name: d.name || '', username: d.username || '' }));
    if (d.name && !ls.get('soz-name')) ls.set('soz-name', d.name);
    // An existing account brings its own code: switch to it, then merge this device's words into it.
    if (d.code && d.code !== CODE) adoptCode(d.code); else syncAll();
    paintAccount();
    closeSheet(); refreshPicker();
}
/* ---------- login with Google (ID token checked on the server; email is not stored) ---------- */
const G_CLIENT = '570872540423-p6biqjvc05lfgp1l49o1rf0o80lq4e4r.apps.googleusercontent.com';
let gLib = null;
function mountGoogle() {
  if (account()) return;
  if (!gLib) gLib = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = no; document.head.appendChild(s); })
    .then(() => google.accounts.id.initialize({ client_id: G_CLIENT, callback: onGoogle, ux_mode: 'popup', auto_select: false, itp_support: true }));
  gLib.then(() => document.querySelectorAll('[data-g]').forEach(box => {
    if (box.closest('[hidden]') || box.childElementCount) return;
    google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', shape: 'rectangular', text: 'signin_with', locale: 'ru', width: 240 });
  })).catch(() => {});
}
async function onGoogle(resp) {
  try {
    const r = await fetch(SB + '/functions/v1/soz-google-login', { method: 'POST', headers: { apikey: SBK, 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential, code: CODE }) });
    if (!r.ok) throw new Error('login ' + r.status);
    finishLogin('google', await r.json());
  } catch (e) {
    document.querySelectorAll('[data-tgerr]').forEach(el => el.hidden = false);
  }
}

/* ---------- boot ---------- */
showPicker();
syncAll();
// Offline mode when hosted on its own site (does nothing inside Claude)
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) {
    const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
    // A new version took over → reload once so the icon on the home screen always opens the latest app.
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
} catch (e) {}
</script>
